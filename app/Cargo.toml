[package]
name = "googlejim"
version = "0.1.0"
description = "A Tauri App"
edition = "2021"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
rand = "0.8"
argon2 = "0.5"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
hostname = "0.3"
machine-uid = "0.3"
sysinfo = "0.30"
anyhow = "1.0"
hex = "0.4"
tauri = { version = "1.5", features = ["api-all", "custom-protocol", "system-tray"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.20", features = ["native-tls"] }
futures-util = "0.3"
serde_json = "1.0"
enigo = "0.2.1"
xcap = "0.9.8"
image = "0.25"
base64 = "0.21"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[profile.release]
lto = true
panic = "abort"
codegen-units = 1
opt-level = "z"
strip = true
